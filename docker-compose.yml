# Banco local do site Cesamar — porta 5433 para não conflitar com outros Postgres (ex.: portal Store Control na 5432)
services:
  postgres:
    image: postgres:16-alpine
    container_name: cesamar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cesamar
      POSTGRES_USER: cesamar
      POSTGRES_PASSWORD: cesamar_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5433:5432"
    volumes:
      - cesamar-pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cesamar -d cesamar"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  cesamar-pgdata:
